<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();

  <script>
    const appElement = document.getElementById('app');
    const launchScreen = document.getElementById('launch');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');
    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = error && error.stack || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);
    try {
      setProgress(0.1);
      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 480;
      scaffolding.height = 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);
      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };
      scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor("#ff4c4c");
      try {
        scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(["wss://clouddata.turbowarp.org", "wss://clouddata.turbowarp.xyz"], "p4-@Incredibox - Sprunki.sb3"));
      } catch (error) {
        console.error(error);
      }
      vm.setTurboMode(true);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(60);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: true,
        miscLimits: true,
        maxClones: 300,
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: true,
        warpTimer: false
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);
      if (typeof ScaffoldingAddons !== 'undefined') {
        ScaffoldingAddons.run(scaffolding, {
          "gamepad": false,
          "pointerlock": false,
          "specialCloudBehaviors": false,
          "unsafeCloudBehaviors": false,
          "pause": false
        });
      }
      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
      for (const extension of []) {
        vm.extensionManager.loadExtensionURL(extension);
      }
    } catch (e) {
      handleError(e);
    }
  </script>
  <script>
    const getProjectData = (function() {
      const storage = scaffolding.storage;
      storage.onprogress = (total, loaded) => {
        setProgress(interpolate(0.2, 0.98, loaded / total));
      };
      storage.addWebStore([storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound, storage.AssetType.Font].filter(i => i), (asset) => new URL('https://cdn.jsdelivr.net/gh/bubblfan/sprunki/assets/' + asset.assetId + '.' + asset.dataFormat, location).href);
      return () => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
          resolve(xhr.response);
        };
        xhr.onerror = () => {
          if (location.protocol === 'file:') {
            reject(new Error('Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'));
          } else {
            reject(new Error('Request to load project data failed.'));
          }
        };
        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress(interpolate(0.1, 0.2, e.loaded / e.total));
          }
        };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "https://cdn.jsdelivr.net/gh/bubblfan/sprunki/assets/project.json");
        xhr.send();
      });
    })();
  </script>
  <script>
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      if (false) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>
