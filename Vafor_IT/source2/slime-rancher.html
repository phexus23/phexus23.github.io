<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>

<body>
    <div class="webgl-content">
        <div class="bg">
            <img class="bg" src="TemplateData/loading_bg.png" style="width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; position: absolute;">
        </div>
        <div id="loading-text" style="-webkit-text-stroke-width: 2px; -webkit-text-stroke-color: black; color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
        <div id="gameContainer" style="width: 960px; height: 600px"></div>
    </div>
    <script src="TemplateData/responsive.js"></script>
</body>
<script>

    const ogxhr = window.XMLHttpRequest;

    function xhrfunc() {
        const xhr = new ogxhr();
        const open = xhr.open;
        xhr.open = function(method, url, ...rest) {
            if (url.includes("blob:")) {
                return open.call(this, method, "blob:"+url.split("blob:")[1], ...rest);
            }
            return open.call(this, method, url, ...rest);
        };
        return xhr;
    }
    window.XMLHttpRequest = xhrfunc;

    var loadingText = document.querySelector("#loading-text");

    let loadedBytes = 0;

    async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;

        while (true) {
            const {
                done,
                value
            } = await reader.read();
            if (done) break;
            received += value.length;
            loadedBytes += value.length;
            chunks.push(value);

            let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            let mbTotal = '54.5';
            loadingText.innerHTML = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
        }

        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
        }
        return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts) {
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
        }
        return parts;
    }

    function resizeUnityContainer() {
        var container = document.getElementById("gameContainer");
        var canvas = container.querySelector("canvas");

        container.style.width = window.innerWidth + "px";
        container.style.height = window.innerHeight + "px";

        if (canvas) {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }
    }


    (async () => {
        const [dataUrl] = await Promise.all([
            mergeFiles(getParts("Build/slimeBUILDS.data.unityweb", 1, 3)),
        ]);

        const json = {
            "companyName": "Snubs",
            "productName": "Slime Rancher Prototype",
            "dataUrl": dataUrl,
            "wasmCodeUrl": "slimeBUILDS.wasm.code.unityweb",
            "wasmFrameworkUrl": "slimeBUILDS.framework.unityweb",
            "TOTAL_MEMORY": 536870912,
            "graphicsAPI": ["WebGL 2.0", "WebGL 1.0"],
            "webglContextAttributes": {
                "preserveDrawingBuffer": false
            },
            "splashScreenStyle": "Dark"
        };

        let blob = new Blob([JSON.stringify(json)], {
            type: "application/json"
        });
        let blobUrl = URL.createObjectURL(blob);
        window.addEventListener("resize", resizeUnityContainer);

        UnityLoader.instantiate("gameContainer", json, {
            url: blobUrl,
            Module: {
                onRuntimeInitialized: function() {
                    resizeUnityContainer();
                    document.querySelector("#loading-text").remove();
                },
            },
        });
    })();
</script>
