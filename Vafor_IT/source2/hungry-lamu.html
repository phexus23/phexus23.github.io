<html lang="en-us">
<base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/hungry%20lamu/">
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>game</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    /* keep loading bar on top */
    #unity-loading-bar { z-index: 10; }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>
<script>
    var loaderUrl =  "Build/WebGL.loader.js";
    var config = {
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Kulu",
        productName: "Hungry Lamu",
        productVersion: "1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.getElementsByTagName("head")[0].innerHTML += '<meta name="viewport" content="user-scalable=no">';
      document.getElementsByTagName("head")[0].innerHTML += '<meta name="HandheldFriendly" content="true" />';

      document.addEventListener("gesturestart", function(e) {
        e.preventDefault();
      });

      document.addEventListener("gesturechange", function(e) {
        e.preventDefault();
      });
      document.addEventListener("gestureend", function(e) {
        e.preventDefault();
      });

      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
      // make mobile full-screen
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    } else {
      // make desktop canvas fill the viewport
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.width = '100%';
      container.style.height = '100%';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      config.devicePixelRatio = window.devicePixelRatio || 1;
    }
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      (async () => {
        try {
          async function fetchMaybeSplit(baseUrl) {
            // Try .part1 + .part2 first
            try {
              const p1 = await fetch(baseUrl + '.part1');
              const p2 = await fetch(baseUrl + '.part2');
              if (p1.ok && p2.ok) {
                const b1 = await p1.arrayBuffer();
                const b2 = await p2.arrayBuffer();
                const combined = new Uint8Array(b1.byteLength + b2.byteLength);
                combined.set(new Uint8Array(b1), 0);
                combined.set(new Uint8Array(b2), b1.byteLength);
                return combined.buffer;
              }
            } catch (e) {
              // ignore and fall back to single file
            }

            // Fallback: single file
            const single = await fetch(baseUrl);
            if (!single.ok) throw new Error('Failed to fetch ' + baseUrl);
            return await single.arrayBuffer();
          }

          const dataBuf = await fetchMaybeSplit( 'Build/WebGL.data');
          const wasmBuf = await fetchMaybeSplit( 'Build/WebGL.wasm');
          const combinedBlob = new Blob([dataBuf, wasmBuf], { type: 'application/octet-stream' });
          const dataSlice = combinedBlob.slice(0, dataBuf.byteLength, 'application/octet-stream');
          const wasmSlice = combinedBlob.slice(dataBuf.byteLength, dataBuf.byteLength + wasmBuf.byteLength, 'application/wasm');
          const dataBlobUrl = URL.createObjectURL(dataSlice);
          const wasmBlobUrl = URL.createObjectURL(wasmSlice);

          config.dataUrl = dataBlobUrl;
          config.codeUrl = wasmBlobUrl;

          let unityInstanceVar = null;
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            unityInstanceVar = unityInstance;
            loadingBar.style.display = 'none';
            // ensure canvas backing store matches display size
            function resizeCanvas() {
              const dpr = config.devicePixelRatio || 1;
              const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
              const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
              if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
              }
            }
            // initial size and on resize
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Revoke blob URLs after a short delay to ensure they've been used by the loader
            setTimeout(() => {
              try {
                URL.revokeObjectURL(dataBlobUrl);
                URL.revokeObjectURL(wasmBlobUrl);
              } catch (e) {
                // ignore revoke errors
              }
            }, 5000);
          }).catch((message) => {
            alert(message);
          });
        } catch (e) {
          alert('Error loading build files: ' + e);
        }
      })();
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
