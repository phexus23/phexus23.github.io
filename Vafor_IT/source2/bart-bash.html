			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">

			<div id="status-notice"></div>

		<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>
<script src="index.js"></script>
<script>
async function fetchAndMergeFile(baseUrl, filename, parts) {
  const chunks = [];
  
  for (let i = 1; i <= parts; i++) {
    const response = await fetch(`${baseUrl}${filename}.part${i}`);
    if (!response.ok) throw new Error(`Failed to fetch ${filename}.part${i}`);
    const arrayBuffer = await response.arrayBuffer();
    chunks.push(arrayBuffer);
  }
  
  const totalLength = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
  const merged = new Uint8Array(totalLength);
  let offset = 0;
  
  for (const chunk of chunks) {
    merged.set(new Uint8Array(chunk), offset);
    offset += chunk.byteLength;
  }
  
  return merged.buffer;
}

async function initializeGame() {
  const baseUrl = 'https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/stupidbartbash/';
  
  console.log('loading them files');
  const [wasmData, pckData] = await Promise.all([
    fetchAndMergeFile(baseUrl, 'index.wasm', 3),
    fetchAndMergeFile(baseUrl, 'index.pck', 6)
  ]);
  
  console.log('merged FINALLY');

  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    if (url.includes('index.wasm')) {
      return Promise.resolve(new Response(wasmData, {
        status: 200,
        headers: { 'Content-Type': 'application/wasm' }
      }));
    }
    if (url.includes('index.pck')) {
      return Promise.resolve(new Response(pckData, {
        status: 200,
        headers: { 'Content-Type': 'application/octet-stream' }
      }));
    }
    return originalFetch(url, options);
  };
  
  console.log('starting engine');
  startGodotEngine();
}

function startGodotEngine() {
  const GODOT_CONFIG = {
    "args":[],
    "canvasResizePolicy":2,
    "ensureCrossOriginIsolationHeaders":true,
    "executable":"index",
    "experimentalVK":false,
    "fileSizes":{"index.pck":81342576,"index.wasm":43699192},
    "focusCanvas":true,
    "gdextensionLibs":[]
  };
  const GODOT_THREADS_ENABLED = false;
  const engine = new Engine(GODOT_CONFIG);

  (function () {
    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
      if (statusMode === mode || !initializing) {
        return;
      }
      if (mode === 'hidden') {
        statusOverlay.remove();
        initializing = false;
        return;
      }
      statusOverlay.style.visibility = 'visible';
      statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
      statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
      statusMode = mode;
    }

    function setStatusNotice(text) {
      while (statusNotice.lastChild) {
        statusNotice.removeChild(statusNotice.lastChild);
      }
      const lines = text.split('\n');
      lines.forEach((line) => {
        statusNotice.appendChild(document.createTextNode(line));
        statusNotice.appendChild(document.createElement('br'));
      });
    }

    function displayFailureNotice(err) {
      console.error(err);
      if (err instanceof Error) {
        setStatusNotice(err.message);
      } else if (typeof err === 'string') {
        setStatusNotice(err);
      } else {
        setStatusNotice('An unknown error occurred.');
      }
      setStatusMode('notice');
      initializing = false;
    }

    const missing = Engine.getMissingFeatures({
      threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
      const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
      displayFailureNotice(missingMsg + missing.join('\n'));
    } else {
      setStatusMode('progress');
      engine.startGame({
        'onProgress': function (current, total) {
          if (current > 0 && total > 0) {
            statusProgress.value = current;
            statusProgress.max = total;
          } else {
            statusProgress.removeAttribute('value');
            statusProgress.removeAttribute('max');
          }
        },
      }).then(() => {
        setStatusMode('hidden');
      }, displayFailureNotice);
    }
  }());
}

initializeGame().catch(err => {
  console.error('Failed to initialize game:', err);
  document.getElementById('status-notice').textContent = 'Failed to load game files: ' + err.message;
  document.getElementById('status-notice').style.display = 'block';
});
</script>
