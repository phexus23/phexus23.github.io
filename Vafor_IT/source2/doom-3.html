/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();

      apply: function () { return res(); }

  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();

<div id="game-container">
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner" id='spinner'></div>
        <div id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden="true"></progress>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="console">
        <div id="console-header">
            <span>Console</span>
            <span id="console-close">X</span>
        </div>
        <div id="console-output">
            doom 3 consle baby<br>
            <span id="console-log"></span>
        </div>

            <input type="text" id="console-input" placeholder="Type command...">
            <button id="console-submit">Submit</button>
        </div>
    </div>
</div>

<script type='text/javascript'>
  var statusElement = document.getElementById('status');
  var progressElement = document.getElementById('progress');
  var spinnerElement = document.getElementById('spinner');
  var consoleElement = document.getElementById('console');
  var consoleInput = document.getElementById('console-input');
  var consoleLog = document.getElementById('console-log');
  var consoleSubmit = document.getElementById('console-submit');
  var consoleClose = document.getElementById('console-close');

  function toggleConsole() {
    var isVisible = consoleElement.style.display === 'flex';
    if (isVisible) {
        consoleElement.style.display = 'none';
        Module.canvas.focus();
    } else {
        consoleElement.style.display = 'flex';
        consoleInput.focus();
    }
  }

  function handleConsoleInput() {
    var command = consoleInput.value.trim();
    if (command) {
        var logEntry = document.createElement('div');
        logEntry.innerHTML = ']' + command;
        consoleLog.appendChild(logEntry);
        consoleInput.value = '';
        consoleLog.parentElement.scrollTop = consoleLog.parentElement.scrollHeight;
    }
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === '`' || event.key === '~') {
      event.preventDefault();
      toggleConsole();
    } else if (event.key === 'Enter' && consoleElement.style.display === 'flex') {
      event.preventDefault();
      handleConsoleInput();
    }
  });

  consoleSubmit.addEventListener('click', handleConsoleInput);
  consoleClose.addEventListener('click', toggleConsole);

  var isDragging = false;
  var currentX;
  var currentY;
  var initialX;
  var initialY;
  var xOffset = 0;
  var yOffset = 0;

  function dragStart(e) {
    initialX = e.clientX - xOffset;
    initialY = e.clientY - yOffset;
    isDragging = true;
  }

  function dragEnd(e) {
    initialX = currentX;
    initialY = currentY;
    isDragging = false;
  }

  function drag(e) {
    if (isDragging) {
      e.preventDefault();
      currentX = e.clientX - initialX;
      currentY = e.clientY - initialY;

      xOffset = currentX;
      yOffset = currentY;

      consoleElement.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
    }
  }

  document.getElementById('console-header').addEventListener('mousedown', dragStart);
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('mousemove', drag);


  var Module = {
    preRun: [],
    postRun: [],
    print: (function () {
      return function (text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        
        var logEntry = document.createElement('div');
        logEntry.innerHTML = text;
        consoleLog.appendChild(logEntry);
        
        console.log(text);
        consoleLog.parentElement.scrollTop = consoleLog.parentElement.scrollHeight;
      };
    })(),
    printErr: function (text) {
      if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
      console.error(text);
    },
    canvas: (function () {
      var canvas = document.getElementById('canvas');

      canvas.addEventListener("webglcontextlost", function (e) {
        console.error('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      return canvas;
    })(),
    hideStatus: function() {
      document.getElementById('loading-overlay').style.display = "none";
    },
    showStatus: function() {
      document.getElementById('loading-overlay').style.display = "flex";
    },
    setStatus: function (text) {
      if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
      if (text === Module.setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - Module.setStatus.last.time < 30) return;
      Module.setStatus.last.time = now;
      Module.setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      if (!left) {
        Module.hideStatus();
      }
      else {
        Module.showStatus();
      }
    }
  };
  Module.setStatus('Downloading...');
  window.onerror = function (event) {
    Module.setStatus('Exception thrown, see JavaScript console');
    spinnerElement.style.display = 'none';
    Module.setStatus = function (text) {
      if (text) Module.printErr('[post-exception status] ' + text);
    };
  };
</script>
