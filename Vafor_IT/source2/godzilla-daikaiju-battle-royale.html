<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>

<body>
  <div id="loading-text">Loading game... 0%</div>
  <div id="flash-container"></div>
  <script>
    const container = document.getElementById("flash-container");
    const loadingText = document.getElementById("loading-text");

    function mergeSWFParts(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        let totalSize = 0;
        let loadedSize = 0;

        function updateProgress() {
          if (totalSize > 0) {
            const pct = Math.round((loadedSize / totalSize) * 100);
            if (loadingText) {
              loadingText.textContent = `Loading game... ${pct}%`;
            }
          }
        }

        function fetchPart(i) {
          if (i >= fileParts.length) {
            if (loadingText) {
              loadingText.textContent = 'Merging files...';
            }
            let mergedBlob = new Blob(buffers, { type: 'application/x-shockwave-flash' });
            let mergedUrl = URL.createObjectURL(mergedBlob);
            resolve(mergedUrl);
            return;
          }

          fetch(fileParts[i])
            .then(response => {
              if (!response.ok) {
                throw new Error(`Failed to load ${fileParts[i]}: ${response.status}`);
              }
              const contentLength = response.headers.get('content-length');
              if (contentLength) {
                totalSize += parseInt(contentLength);
              }
              return response.arrayBuffer();
            })
            .then(data => {
              buffers.push(data);
              loadedSize += data.byteLength;
              updateProgress();
              fetchPart(i + 1);
            })
            .catch(reject);
        }

        fetchPart(0);
      });
    }

    function getSWFParts(baseFile, start, end) {
      let arr = [];
      for (let i = start; i <= end; i++) {
        arr.push(`${baseFile}.part${i}`);
      }
      return arr;
    }

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 4 / 3;
      let width = Math.floor(windowWidth);
      let height = Math.floor(windowWidth / aspectRatio);
      if (height > windowHeight) {
        height = Math.floor(windowHeight);
        width = Math.floor(height * aspectRatio);
      }
      container.style.width = `${width}px`;
      container.style.height = `${height}px`;
    }

    window.addEventListener("resize", resizeGame);

    window.addEventListener("DOMContentLoaded", () => {
      resizeGame();
      
      console.log('Starting SWF merge...');
      
      const swfParts = getSWFParts('gdbr.swf', 1, 3); 
      
      const useSingleFile = false; 
      const singleFileUrl = "gdbr.swf";

      const loadPromise = useSingleFile 
        ? Promise.resolve(singleFileUrl)
        : mergeSWFParts(swfParts);

      loadPromise
        .then(swfUrl => {
          console.log('SWF ready, loading into Ruffle...');
          if (loadingText) {
            loadingText.textContent = 'Starting game...';
          }

          const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
          if (ruffle && container) {
            const player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            player.style.background = "black";
            container.appendChild(player);
            
            player.load(swfUrl).then(() => {
              console.log('Game loaded successfully');
              if (loadingText) {
                loadingText.remove();
              }
            }).catch(err => {
              console.error('Ruffle load error:', err);
              if (loadingText) {
                loadingText.textContent = 'Error loading game: ' + err.message;
              }
            });
          } else {
            console.error('Ruffle not available');
            if (loadingText) {
              loadingText.textContent = "Ruffle failed to load.";
            }
          }
        })
        .catch(err => {
          console.error('SWF merge error:', err);
          if (loadingText) {
            loadingText.textContent = 'Error loading game files: ' + err.message;
          }
        });
    });
  </script>
