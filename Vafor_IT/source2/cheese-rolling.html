<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity WebGL Player | CheeseRolling</title>
    <base
      href="https://cdn.jsdelivr.net/gh/SomeRandomFella/portsandrips@master/CheeseRollingWeb/"
    />
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      #part-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }
      #part-loader h1 {
        font-size: 2em;
        margin-bottom: 20px;
      }
      .part-item {
        width: 400px;
        margin: 6px 0;
        font-size: 1em;
      }
      .part-label {
        margin-bottom: 3px;
      }
      .part-bar-bg {
        width: 100%;
        height: 18px;
        background: #ddd;
        border: 2px solid black;
      }
      .part-bar-fill {
        height: 100%;
        background: #f5c518;
        width: 0%;
        transition: width 0.1s;
      }
      .part-status {
        font-size: 0.85em;
        color: #555;
      }
      #overall-status {
        margin-top: 20px;
        font-size: 1.1em;
      }
    </style>
  </head>
  <body>
    <div id="part-loader">
      <h1>Loading 🧀🧀🧀🧀🧀</h1>
      <div id="parts-list"></div>
      <div id="overall-status">rolling cheese wheels...</div>
    </div>

    <div id="unity-container" style="display: none">
      <canvas id="unity-canvas" width="480" height="360" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>
<script>
      alert(
        "multiplayer is a bit buggy and laggy if anything multiplayer related breaks js refresh | ported by sexyplankton",
      );

      const PART_FILES = [
        { base: "Build/CheeseRollingWeb.data", label: "CheeseRolling.data" },
        { base: "Build/CheeseRollingWeb.wasm", label: "CheeseRolling.wasm" },
      ];

      const assembledBlobs = {};

      const partsList = document.getElementById("parts-list");
      const overallStatus = document.getElementById("overall-status");

      function makePartRow(id, label) {
        const wrap = document.createElement("div");
        wrap.className = "part-item";
        wrap.innerHTML = `
          <div class="part-label" id="lbl-${id}">${label}</div>
          <div class="part-bar-bg"><div class="part-bar-fill" id="bar-${id}"></div></div>
          <div class="part-status" id="status-${id}">waiting...</div>
        `;
        partsList.appendChild(wrap);
      }

      function setBar(id, pct) {
        document.getElementById("bar-" + id).style.width = pct + "%";
      }

      function setStatus(id, text) {
        document.getElementById("status-" + id).textContent = text;
      }

      async function countParts(base) {
        let n = 1;
        while (true) {
          const partName = `${base}.part${String(n).padStart(3, "0")}`;
          const res = await fetch(partName, { method: "HEAD" });
          if (!res.ok) break;
          n++;
        }
        if (n === 1) {
          return 0;
        }
        return n - 1;
      }

      async function fetchPart(url, onProgress) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
        const total = parseInt(res.headers.get("Content-Length") || "0", 10);
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total) onProgress(received / total);
        }
        return new Blob(chunks);
      }

      async function loadFile(fileInfo, rowIdPrefix) {
        const { base, label } = fileInfo;
        const numParts = await countParts(base);

        const rowIds = [];
        for (let i = 1; i <= numParts; i++) {
          const rowId = `${rowIdPrefix}_${i}`;
          rowIds.push(rowId);
          makePartRow(rowId, `${label} — part ${i} of ${numParts}`);
        }

        const blobs = [];
        for (let i = 1; i <= numParts; i++) {
          const rowId = rowIds[i - 1];
          const url = `${base}.part${String(i).padStart(3, "0")}`;
          setStatus(rowId, "downloading...");
          const blob = await fetchPart(url, (p) => {
            setBar(rowId, Math.round(p * 100));
            setStatus(rowId, Math.round(p * 100) + "%");
          });
          setBar(rowId, 100);
          setStatus(rowId, "cheezy done");
          blobs.push(blob);
        }

        return new Blob(blobs);
      }

      async function loadAllParts() {
        try {
          for (let i = 0; i < PART_FILES.length; i++) {
            overallStatus.textContent = `LOADING ${PART_FILES[i].label}...`;
            const blob = await loadFile(PART_FILES[i], "file" + i);
            assembledBlobs[PART_FILES[i].base] = URL.createObjectURL(blob);
          }

          overallStatus.textContent = "chhese";
          setTimeout(startUnity, 600);
        } catch (e) {
          overallStatus.textContent = "it broke!111! " + e.message;
          console.error(e);
        }
      }

      function startUnity() {
        document.getElementById("part-loader").style.display = "none";
        document.getElementById("unity-container").style.display = "";

        window.addEventListener("load", function () {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("ServiceWorker.js");
          }
        });

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector(
          "#unity-progress-bar-full",
        );
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
          function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length
              ? "block"
              : "none";
          }
          var div = document.createElement("div");
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type == "error") div.style = "background: red; padding: 10px;";
          else {
            if (type == "warning")
              div.style = "background: yellow; padding: 10px;";
            setTimeout(function () {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }, 5000);
          }
          updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/CheeseRollingWeb.loader.js";
        var config = {
          dataUrl:
            assembledBlobs["Build/CheeseRollingWeb.data"] ||
            buildUrl + "/CheeseRollingWeb.data",
          frameworkUrl: buildUrl + "/CheeseRollingWeb.framework.js",
          codeUrl:
            assembledBlobs["Build/CheeseRollingWeb.wasm"] ||
            buildUrl + "/CheeseRollingWeb.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "The Interviewed",
          productName: "CheeseRolling",
          productVersion: "v1.5.1",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      }

      loadAllParts();
    </script>
  </body>
</html>
