<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>

<script>
const loadingText = document.querySelector("#loading-text");
const CACHE_NAME = "hksilksongcache-v2"; // bump version if needed

/* ================= FETCH OVERRIDE ================= */
const originalFetch = window.fetch;

window.fetch = async function(resource, options) {
  let url = typeof resource === "string" ? resource : resource.url;
  let cleanPath = url.split("/").pop();

  const cache = await caches.open(CACHE_NAME);

  const cachedResponse = await cache.match(cleanPath);
  if (cachedResponse) {
    return cachedResponse;
  }

  return originalFetch(resource, options);
};

/* ================= CACHE CHECK ================= */
async function isCached() {
  const cache = await caches.open(CACHE_NAME);
  const done = await cache.match("CACHE_COMPLETE");
  return !!done;
}

async function cleanupOldCaches() {
  const cacheNames = await caches.keys();

  await Promise.all(
    cacheNames.map(name => {
      if (name !== CACHE_NAME && name.includes("hksilksong")) {
        console.log("Deleting old cache:", name);
        return caches.delete(name);
      }
    })
  );
}

/* ================= UNZIP ================= */
async function unzipAndStore(zipBlob) {
  if (!zipBlob) {
    throw new Error("ZIP is missing");
  }

  loadingText.textContent = "EXTRACTING ASSETS...";

  const zip = await JSZip.loadAsync(zipBlob);
  const files = Object.values(zip.files).filter(f => !f.dir);
  const total = files.length;

  const cache = await caches.open(CACHE_NAME);

  let processed = 0;
  const batchSize = 10;

  for (let i = 0; i < files.length; i += batchSize) {
    const batch = files.slice(i, i + batchSize);

    await Promise.all(batch.map(async (file) => {
      try {
        const blob = await file.async("blob");
        await cache.put(file.name, new Response(blob));
      } catch (e) {
        console.error("Failed:", file.name, e);
      }

      processed++;
      loadingText.textContent =
        `EXTRACTING ASSETS... (${processed}/${total})`;
    }));

    await new Promise(r => setTimeout(r, 0));
  }

  // ✅ mark cache complete
  await cache.put("CACHE_COMPLETE", new Response("ok"));

  console.log("Cache complete");
}

/* ================= DOWNLOAD ================= */
let loadedBytes = 0;

async function fetchWithProgress(url) {
  const response = await originalFetch(url);

  if (!response.ok) {
    throw new Error("Failed to fetch: " + url);
  }

  const reader = response.body.getReader();
  let chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    received += value.length;
    loadedBytes += value.length;
    chunks.push(value);

    let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
    let mbTotal = '1986.64';

    loadingText.textContent =
      `DOWNLOADING ASSETS... (${mbDone} MB / ${mbTotal} MB)`;
  }

  let fullBuffer = new Uint8Array(received);
  let offset = 0;

  for (let chunk of chunks) {
    fullBuffer.set(chunk, offset);
    offset += chunk.length;
  }

  return fullBuffer.buffer;
}

/* ================= MERGE ================= */
async function mergeFiles(parts) {
  console.log("Downloading parts:", parts.length);

  const buffers = await Promise.all(
    parts.map(part => fetchWithProgress(part))
  );

  return new Blob(buffers);
}

/* ================= UTIL ================= */
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) {
    parts.push(file + ".part" + i);
  }
  return parts;
}

/* ================= MAIN ================= */
(async () => {
  try {
    await cleanupOldCaches(); 
    if (!(await isCached())) {
      loadingText.textContent = "DOWNLOADING ASSETS...";

      const webglzip = await mergeFiles(
        getParts("StreamingAssets/aa/WebGL.zip", 1, 100)
      );

      await unzipAndStore(webglzip);
    } else {
      loadingText.textContent = "LOADING FROM CACHE...";
    }

    /* ================= UNITY START ================= */
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function update() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      let div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background:red;padding:10px;';
      } else {
        if (type == 'warning') {
          div.style = 'background:yellow;padding:10px;';
        }
        setTimeout(() => {
          warningBanner.removeChild(div);
          update();
        }, 5000);
      }

      update();
    }

    const buildUrl = "Build";

    const config = {
      dataUrl: buildUrl + "/w-pt.data.unityweb",
      frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
      codeUrl: buildUrl + "/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@latest/Build/w-pt.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      })
      .then(() => {
        loadingBar.remove();
        loadingText.remove();
      })
      .catch(alert);
    };

    document.body.appendChild(script);

  } catch (err) {
    console.error(err);
    loadingText.textContent = "ERROR: " + err.message;
  }
})();
</script>
