<script>
/*!
 * ytgame-shim.js — drop-in replacement for the YouTube Playables Web SDK (ytgame.js).
 *
 * The genizymath "youtube-playables" wrappers ship a real ytgame.js plus an
 * obfuscated ad/anti-tamper blob. Off YouTube, the real SDK's ad + data calls
 * post to a parent frame that never answers, so they hang; the obf blob patched
 * around that by loading an ad network (cdn.r9x.in / gn-math) and showing
 * interstitials + sidebar/popup ads.
 *
 * strip_ads.py removes the obf blob and swaps ytgame.js for this file. Result:
 *   - ad calls resolve instantly (no ad shown)
 *   - saveData/loadData actually work, backed by localStorage
 *   - every other call is a safe no-op
 *   - unknown calls can't throw (Proxy fallback)
 */
(function () {
  'use strict';
  var KEY = 'ytg:' + (location.pathname || 'game');
  var res = function (v) { return Promise.resolve(v); };
  var noop = function () {};
  var listeners = {};

  function store(get, val) {
    try {
      if (get) return localStorage.getItem(KEY);
      if (val == null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, String(val));
    } catch (e) {}
    return null;
  }

  var game = {
    firstFrameReady: noop,
    gameReady: noop,
    loadingProgress: noop,
    hasLoadingUI: function () { return false; },
    onPause: function (cb) { listeners.pause = cb; },
    onResume: function (cb) { listeners.resume = cb; },
    saveData: function (d) { store(false, d); return res(); },
    loadData: function () { return res(store(true) || ''); },
    getData: function () { return store(true) || ''; }
  };

  var ads = {
    requestInterstitialAd: function () { return res(); },
    requestRewardedAd: function () { return res(); },
    adBreak: function () { return res(); }
  };

  var system = {
    getEngagementType: function () { return 'PLAYING'; },
    getConfig: function () { return { engagementType: 'PLAYING' }; },
    isAudioEnabled: function () { return true; },
    onAudioEnabledChange: noop,
    getLanguage: function () { return (navigator.language || 'en').slice(0, 2); },
    getSurface: function () { return 'BROWSER'; }
  };

  var engagement = { sendAbandonment: noop };
  var health = { logError: noop, logWarning: noop, stuck: noop, unstuck: noop };

  // Any property/method we didn't define returns a chainable no-op that also
  // works as a resolved promise, so `ytgame.whatever.foo().then(...)` never throws.
  function chainNoop() {
    var f = function () { return res(); };
    return new Proxy(f, {
      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        return chainNoop();
      },
      apply: function () { return res(); }
    });
  }
  function wrap(obj) {
    return new Proxy(obj, {
      get: function (t, p) {
        if (p in t) return t[p];
        if (typeof p === 'symbol') return t[p];
        return chainNoop();
      }
    });
  }

  var ytgame = {
    SDK_VERSION: '1.7.0-shim',
    IN_PLAYABLES_ENV: false,
    game: wrap(game),
    ads: wrap(ads),
    system: wrap(system),
    engagement: wrap(engagement),
    health: wrap(health)
  };

  try { Object.defineProperty(window, 'ytgame', { value: wrap(ytgame), writable: false, configurable: true }); }
  catch (e) { window.ytgame = wrap(ytgame); }

  // Fire resume once, in case a game waits for it before starting.
  setTimeout(function () { try { if (listeners.resume) listeners.resume(); } catch (e) {} }, 0);
})();
</script>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        let myGameInstance = null;
        let isAdShown = false;

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        function showAdOnClick() {
            if (!isAdShown && typeof sdk !== 'undefined' && typeof sdk.showBanner !== 'undefined') {
                sdk.showBanner();
                isAdShown = true;
                console.log("Reklam çağrıldı.");
            } else {
                console.warn("SDK veya showBanner tanımlı değil.");
            }
        }

        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,
            browser: (function() {
                let userAgent = navigator.userAgent;
                if (userAgent.includes("YaBrowser")) return "Yandex";
                if (userAgent.includes("OPR") || userAgent.includes("Opera")) return "Opera";
                if (userAgent.includes("Firefox")) return "Firefox";
                if (userAgent.includes("MSIE") || userAgent.includes("Trident")) return "IE";
                if (userAgent.includes("Edge")) return "Edge";
                if (userAgent.includes("Chrome")) return "Chrome";
                if (userAgent.includes("Safari")) return "Safari";
                return "Other";
            })()
        };

        async function mergeFiles(parts, onProgress) {
            let loaded = 0;
            const total = parts.length;
            const blobs = await Promise.all(parts.map(async (part, index) => {
                const res = await fetch(part);
                const blob = await res.blob();
                loaded++;
                if (onProgress) onProgress(loaded / total);
                return blob;
            }));
            return URL.createObjectURL(new Blob(blobs));
        }

        async function initializeGame() {
            var buildUrl = "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build";
            var loaderUrl = buildUrl + "/Granny 2.loader.js";
            
            var dataParts = [
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build/Granny 2_part1.data", 
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build/Granny 2_part2.data", 
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build/Granny 2_part3.data"
            ];
            var wasmParts = [
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build/Granny 2_part1.wasm", 
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build/Granny 2_part2.wasm"
            ];
            
            loadingBar.style.display = "block";
            
            var dataUrl = await mergeFiles(dataParts, progress => {
                progressBarFull.style.width = (50 * progress) + "%";
            });
            var wasmUrl = await mergeFiles(wasmParts, progress => {
                progressBarFull.style.width = (50 + 50 * progress) + "%";
            });
            
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/Granny 2.frameworkx.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Awesome",
                productName: "Granny 2",
                productVersion: "1.0",
                showBanner: unityShowBanner,
            };
            
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = (100 * progress) + "%";
                }).then((unityInstance) => {
                    myGameInstance = unityInstance;
                    setTimeout(() => { loadingBar.style.display = "none"; }, 500);
                    // Oyun yüklendiğinde tıklama olayını ekle
                    canvas.addEventListener('pointerdown', showAdOnClick);
                    canvas.addEventListener('touchstart', showAdOnClick);
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        }

        initializeGame();
    </script>
